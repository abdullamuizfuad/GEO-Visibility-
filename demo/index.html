<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B332D">
<meta name="color-scheme" content="light dark">
<title>Ruka Visibility Lab</title>
<script>try{var t=localStorage.getItem('ruka-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="../fonts/poppins.css">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><img src="../assets/ruka-emblem-copper.png" alt="Ruka Maldives"></div>
    <div class="ht"><b id="title"></b><small id="sub"></small></div>
    <button class="theme" id="theme" type="button" aria-label="Toggle light or dark mode"><span aria-hidden="true"></span></button>
  </header>

  <!-- 1: pick a traveller -->
  <section class="screen on" id="s-pick">
    <span class="kicker" id="kicker"></span>
    <h1 id="h1"></h1>
    <p id="intro"></p>
    <div class="persona" id="personas"></div>
    <p class="hint" id="hint"></p>
  </section>

  <!-- 2: AI search -->
  <section class="screen" id="s-ai">
    <div class="panel">
      <div class="label"><span class="spark" aria-hidden="true"></span><span id="label"></span></div>
      <form class="prompt" id="form" autocomplete="off">
        <textarea id="q" rows="3" aria-label="Your question" enterkeyhint="search" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea>
        <button id="search" type="submit"></button>
      </form>
      <p class="zh" id="zh" lang="zh"></p>
      <div id="before" class="answer" aria-live="polite"></div>
    </div>
    <div class="stop" id="stop" hidden>
      <b id="stopH"></b><p id="stopP"></p>
    </div>
    <button class="btn" id="again" type="button" hidden></button>
    <div class="panel after" id="after" hidden></div>
    <button class="btn alt" id="restart" type="button" hidden></button>
    <p class="note" id="note"></p>
  </section>
</div>
<script src="data.js"></script>
<script src="demo.js"></script>
</body>
</html>
